name: Frontend quality

on:
  push:
    branches: [beta, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      # Build-only placeholders. No live credentials are available to PR jobs.
      RPC_NODE: http://127.0.0.1:1
      INDEXER_UPSTREAM_URL: http://127.0.0.1:1
      INDEXER_SHARED_SECRET: ci-fixture-only
      NEXT_PUBLIC_CDP_CLIENT_API_KEY: 00000000-0000-4000-8000-000000000000
      NEXT_PUBLIC_PRIVY_APP_ID: c000000000000000000000000
      PRIVY_APP_SECRET: ci-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run frontend:types
      - run: npm run lint
      - run: npm run frontend:smoke
      - run: npm run app-fixes:smoke
      - run: npm run build
      - run: npm run frontend:release-check

  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npx playwright install --with-deps webkit
      - run: npm run frontend:p1
      - run: npm run frontend:p2
      - run: npm run frontend:p3
      - run: npm run frontend:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: |
            output/frontend-test-report
            output/frontend-tests
          retention-days: 14

  transaction-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run remediation:smoke
      - run: npm run remediation:redis:smoke
      - run: npm run audit:regressions
      - run: npm run audit:fixes:smoke
      - run: npm run contracts:check
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run gameplay-guards:smoke
      - run: npm run airdrop-recovery:browser
      - run: npx playwright test tests/frontend/transaction-core-p1.spec.ts --project=390-light --project=1024-light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transaction-remediation-results
          path: |
            output/frontend-test-report
            output/frontend-tests
          retention-days: 14

  visual-baselines:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - run: npx playwright install webkit
      - run: npx playwright test tests/frontend/dense-surfaces.spec.ts --project=390-light --project=1440-dark --project=webkit-390-light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-visual-results-windows
          path: |
            output/frontend-test-report
            output/frontend-tests
          retention-days: 14
